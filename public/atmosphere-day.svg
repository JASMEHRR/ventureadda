<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" width="1600" height="1000">
  <!--
    The day wallpaper, drawn rather than photographed.

    WHY NOT A PHOTOGRAPH. Day mode needs a light image, and the night backdrop
    cannot become one: washing out a starfield leaves the stars, which read as
    snow on a blank page. A photograph would have meant committing somebody
    else's megabyte and its licence into the repo for a background nobody is
    meant to stare at. This is a few kilobytes, scales to any screen without a
    second asset, and uses the brand's own cyan rather than approximately near
    it.

    THE FIRST VERSION WAS INVISIBLE. Every wash sat at around 0.3 opacity over
    near-white, under a further veil, out of caution about the dark text — and
    the result was a page that still looked like it had no background at all.
    The caution was misplaced: day-mode text sits on glass panels filled to
    86% white, so it never touches this. The colour here is therefore strong
    enough to see, and the panels do the contrast work they were built for.
  -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf6fd" />
      <stop offset="50%" stop-color="#dbe9fb" />
      <stop offset="100%" stop-color="#cfe0f7" />
    </linearGradient>

    <radialGradient id="cyan" cx="16%" cy="18%" r="62%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#67e8f9" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sky" cx="86%" cy="8%" r="58%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.70" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="warm" cx="78%" cy="92%" r="62%">
      <stop offset="0%" stop-color="#fbbf87" stop-opacity="0.62" />
      <stop offset="100%" stop-color="#fde3c8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="violet" cx="22%" cy="95%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.52" />
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="teal" cx="52%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0" />
    </radialGradient>

    <!-- A whisper of grain. Flat gradients band visibly across a large screen,
         and a little noise is what stops the sky looking like stripes. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#paper)" />
  <rect width="1600" height="1000" fill="url(#teal)" />
  <rect width="1600" height="1000" fill="url(#cyan)" />
  <rect width="1600" height="1000" fill="url(#sky)" />
  <rect width="1600" height="1000" fill="url(#warm)" />
  <rect width="1600" height="1000" fill="url(#violet)" />

  <!-- Two long, soft sweeps, so the light has a direction rather than sitting
       flat. Rotated off-axis, because a horizontal band reads as a horizon and
       this is not a landscape. -->
  <g>
    <ellipse cx="380" cy="210" rx="780" ry="200" fill="#ffffff" opacity="0.38" transform="rotate(-14 380 210)" />
    <ellipse cx="1220" cy="800" rx="840" ry="220" fill="#ffffff" opacity="0.30" transform="rotate(-9 1220 800)" />
  </g>

  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.05" />
</svg>
